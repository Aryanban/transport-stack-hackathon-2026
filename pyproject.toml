[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "delhi-transport-stack"
version = "1.0.0"
description = "Delhi Transport Stack Hackathon 2026 — Delhi bus journey planner timed by a traffic model learned from bus GPS"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "requests>=2.31.0",
    "numpy>=2.0",
    "pandas>=2.2.0",
    "gtfs-realtime-bindings>=1.0.0",
    "openpyxl>=3.1.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
